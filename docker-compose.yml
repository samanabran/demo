services:
  db:
    image: postgres:16
    container_name: demo_presentation_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_demo_pw
      POSTGRES_DB: postgres
    volumes:
      - demo-presentation-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    container_name: demo_presentation
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18030:8069"
      - "127.0.0.1:18031:8072"
    volumes:
      - ./addons/sgc_tech_ai_theme:/usr/lib/python3/dist-packages/odoo/addons/sgc_tech_ai_theme:ro
      - ./addons/aml_compliance:/usr/lib/python3/dist-packages/odoo/addons/aml_compliance:ro
      - ./addons/kyc_management:/usr/lib/python3/dist-packages/odoo/addons/kyc_management:ro
      - ./addons/_stock_icons/account/icon.png:/usr/lib/python3/dist-packages/odoo/addons/account/static/description/icon.png:ro
      - ./addons/_stock_icons/calendar/icon.png:/usr/lib/python3/dist-packages/odoo/addons/calendar/static/description/icon.png:ro
      - ./addons/_stock_icons/contacts/icon.png:/usr/lib/python3/dist-packages/odoo/addons/contacts/static/description/icon.png:ro
      - ./addons/_stock_icons/crm/icon.png:/usr/lib/python3/dist-packages/odoo/addons/crm/static/description/icon.png:ro
      - ./addons/_stock_icons/hr/icon.png:/usr/lib/python3/dist-packages/odoo/addons/hr/static/description/icon.png:ro
      - ./addons/_stock_icons/hr_attendance/icon.png:/usr/lib/python3/dist-packages/odoo/addons/hr_attendance/static/description/icon.png:ro
      - ./addons/_stock_icons/hr_holidays/icon.png:/usr/lib/python3/dist-packages/odoo/addons/hr_holidays/static/description/icon.png:ro
      - ./addons/_stock_icons/hr_recruitment/icon.png:/usr/lib/python3/dist-packages/odoo/addons/hr_recruitment/static/description/icon.png:ro
      - ./addons/_stock_icons/hr_skills/icon.png:/usr/lib/python3/dist-packages/odoo/addons/hr_skills/static/description/icon.png:ro
      - ./addons/_stock_icons/mail/icon.png:/usr/lib/python3/dist-packages/odoo/addons/mail/static/description/icon.png:ro
      - ./addons/_stock_icons/maintenance/icon.png:/usr/lib/python3/dist-packages/odoo/addons/maintenance/static/description/icon.png:ro
      - ./addons/_stock_icons/project/icon.png:/usr/lib/python3/dist-packages/odoo/addons/project/static/description/icon.png:ro
      - ./addons/_stock_icons/project_todo/icon.png:/usr/lib/python3/dist-packages/odoo/addons/project_todo/static/description/icon.png:ro
      - ./addons/_stock_icons/purchase/icon.png:/usr/lib/python3/dist-packages/odoo/addons/purchase/static/description/icon.png:ro
      - ./addons/_stock_icons/sale_management/icon.png:/usr/lib/python3/dist-packages/odoo/addons/sale_management/static/description/icon.png:ro
      - ./addons/_stock_icons/survey/icon.png:/usr/lib/python3/dist-packages/odoo/addons/survey/static/description/icon.png:ro
      - ./addons/_stock_icons/website/icon.png:/usr/lib/python3/dist-packages/odoo/addons/website/static/description/icon.png:ro
      - ./addons/_stock_icons/website_hr_recruitment/icon.png:/usr/lib/python3/dist-packages/odoo/addons/website_hr_recruitment/static/description/icon.png:ro
      - ./addons/_stock_icons/sale/icon.png:/usr/lib/python3/dist-packages/odoo/addons/sale/static/description/icon.png:ro
      - ./addons/_stock_icons/spreadsheet_dashboard/icon.png:/usr/lib/python3/dist-packages/odoo/addons/spreadsheet_dashboard/static/description/icon.png:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
      - demo-presentation-odoo:/var/lib/odoo
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_demo_pw
    command: odoo --db_host=db --db_user=odoo --db_password=odoo_demo_pw --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons --log-level=warn --db-filter=^demo_presentation$
    restart: unless-stopped
    networks:
      - default
      - odoo-prod-shared

volumes:
  demo-presentation-db:
  demo-presentation-odoo:

networks:
  default:
  odoo-prod-shared:
    external: true
    name: odoo-prod_odoo-prod-network
